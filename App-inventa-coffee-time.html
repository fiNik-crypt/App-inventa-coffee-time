
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учет товаров</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f3f6;color:#222;margin:0;padding:16px}
.app{max-width:950px;margin:auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 18px #0001}
h1{font-size:26px;margin-top:0}
.toolbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:7px;padding:11px 14px;background:#2768cc;color:white;cursor:pointer;font-size:14px}
button:hover{filter:brightness(.92)}
.red{background:#d74747}
.gray{background:#687385}
.green{background:#218653}
.management{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #d8dce3;padding:10px}
th{background:#eaf0f8}
th:first-child,td:first-child{text-align:center;width:75px}
th:last-child,td:last-child{width:155px}
.category td{background:#e8eef9;font-weight:bold}
.category-name{width:100%;font-size:16px;font-weight:bold;border:1px solid transparent;background:transparent;padding:5px}
.item-name{width:100%;min-width:100px;border:1px solid #d4d9e1;border-radius:5px;padding:9px;font-size:15px}
.qty{width:100%;min-width:70px;border:1px solid #d4d9e1;border-radius:5px;padding:9px;font-size:16px}
.status{font-size:13px;color:#218653;margin:12px 0;min-height:18px}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.dialog{background:white;border-radius:12px;padding:22px;width:100%;max-width:420px}
.dialog h2{margin-top:0;font-size:21px}
.dialog input,.dialog select{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;margin:10px 0;font-size:16px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1}
.small{font-size:13px;color:#666;line-height:1.5}
@media(max-width:550px){body{padding:7px}.app{padding:12px}th,td{padding:7px}.toolbar button{flex:1}.management button{flex:1}}
</style>
</head>
<body>
<div class="app">
<h1>Учет товаров</h1>

<div class="toolbar">
<button class="red" onclick="openClear()">Очистить</button>
<button onclick="copyAll()">Скопировать</button>
<button class="green" onclick="exportFile()">Скачать файл</button>
</div>

<div class="management">
<button onclick="openAddCategory()">+ Категория</button>
<button onclick="openAddItem()">+ Товар</button>
<button class="gray" onclick="openDelete()">Удалить</button>
<button class="gray" onclick="openFile()">Открыть файл</button>
<button class="gray" onclick="connectFile()">Автосохранение в файл</button>
</div>

<div style="overflow-x:auto">
<table>
<thead>
<tr><th>№</th><th>Название товара</th><th>Количество</th></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<div class="status" id="status">Данные сохраняются в браузере автоматически.</div>
<p class="small">Автосохранение в браузере включено. Для записи в файл выбери «Автосохранение в файл» и укажи файл JSON.</p>
</div>

<div class="modal" id="modal">
<div class="dialog">
<h2 id="dialogTitle"></h2>
<div id="dialogBody"></div>
<div class="actions" id="dialogActions"></div>
</div>
</div>

<script>
const KEY = "product-inventory-v3";

const initialData = [
 {name:"Сыпучка",items:[
  {name:"таро",qty:"2"},
  {name:"арахис",qty:"1"}
 ]},
 {name:"Стаканы",items:[
  {name:"110",qty:"20"},
  {name:"180",qty:"18"}
 ]},
 {name:"Соки, вода и тд",items:[
  {name:"вода газ",qty:"2"},
  {name:"сок",qty:"3"}
 ]}
];

let sections = loadLocal();
let fileHandle = null;
let saveTimer = null;
let saveChain = Promise.resolve();

function loadLocal(){
 try {
  const saved = localStorage.getItem(KEY);
  if(saved){
   const data = JSON.parse(saved);
   if(Array.isArray(data) && data.every(s =>
    typeof s.name === "string" && Array.isArray(s.items)
   )) return data;
  }
 } catch(e){}
 return structuredClone(initialData);
}

function persist(){
 try {
  localStorage.setItem(KEY, JSON.stringify(sections));
  setStatus("Изменения сохранены в браузере.");
 } catch(e){
  setStatus("Не удалось сохранить данные в браузере.");
 }
 if(fileHandle) saveFile();
}

function setStatus(text){
 document.getElementById("status").textContent = text;
}

function render(){
 const body = document.getElementById("tableBody");
 body.replaceChildren();

 sections.forEach((section, si) => {
  const cat = document.createElement("tr");
  cat.className = "category";

  const number = document.createElement("td");
  number.textContent = si + 1;

  const nameCell = document.createElement("td");
  nameCell.colSpan = 2;
  const input = document.createElement("input");
  input.className = "category-name";
  input.value = section.name;
  input.setAttribute("aria-label","Название категории");
  input.addEventListener("change",()=>{
   section.name = input.value.trim() || "Без названия";
   persist();
   render();
  });
  nameCell.appendChild(input);
  cat.append(number,nameCell);
  body.appendChild(cat);

  section.items.forEach((item, ii) => {
   const tr = document.createElement("tr");
   const num = document.createElement("td");
   num.textContent = `${si+1}.${ii+1}`;

   const nameTd = document.createElement("td");
   const itemInput = document.createElement("input");
   itemInput.className = "item-name";
   itemInput.value = item.name;
   itemInput.setAttribute("aria-label","Название товара");
   itemInput.addEventListener("change",()=>{
    item.name = itemInput.value.trim() || "Без названия";
    persist();
    render();
   });
   nameTd.appendChild(itemInput);

   const qtyTd = document.createElement("td");
   const qtyInput = document.createElement("input");
   qtyInput.className = "qty";
   qtyInput.type = "number";
   qtyInput.min = "0";
   qtyInput.step = "1";
   qtyInput.placeholder = "Количество";
   qtyInput.value = item.qty;
   qtyInput.setAttribute("aria-label","Количество");
   qtyInput.addEventListener("input",()=>{
    item.qty = qtyInput.value;
    persist();
   });
   qtyTd.appendChild(qtyInput);

   tr.append(num,nameTd,qtyTd);
   body.appendChild(tr);
  });
 });
}

function openDialog(title,content,buttons){
 document.getElementById("dialogTitle").textContent = title;
 const body = document.getElementById("dialogBody");
 body.replaceChildren();
 if(typeof content === "string") body.textContent = content;
 else body.appendChild(content);

 const actions = document.getElementById("dialogActions");
 actions.replaceChildren();
 buttons.forEach(b=>{
  const btn = document.createElement("button");
  btn.textContent = b.label;
  if(b.className) btn.className = b.className;
  btn.onclick = b.action;
  actions.appendChild(btn);
 });
 document.getElementById("modal").classList.add("show");
}
function closeDialog(){
 document.getElementById("modal").classList.remove("show");
}
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal") closeDialog();
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape") closeDialog();
});

function makeInput(placeholder){
 const input=document.createElement("input");
 input.placeholder=placeholder;
 input.maxLength=100;
 return input;
}

function openAddCategory(){
 const input=makeInput("Название категории");
 openDialog("Добавить категорию",input,[
  {label:"Отмена",className:"gray",action:closeDialog},
  {label:"Добавить",action:()=>{
   const name=input.value.trim();
   if(!name){input.focus();return;}
   sections.push({name,items:[]});
   persist();render();closeDialog();
  }}
 ]);
 input.focus();
}

function openAddItem(){
 if(!sections.length){
  setStatus("Сначала добавь категорию.");
  return;
 }
 const box=document.createElement("div");
 const select=document.createElement("select");
 sections.forEach((s,i)=>{
  const opt=document.createElement("option");
  opt.value=i;opt.textContent=`${i+1}. ${s.name}`;
  select.appendChild(opt);
 });
 const input=makeInput("Название товара");
 box.append("Категория:",select,input);
 openDialog("Добавить товар",box,[
  {label:"Отмена",className:"gray",action:closeDialog},
  {label:"Добавить",action:()=>{
   const name=input.value.trim();
   if(!name){input.focus();return;}
   sections[Number(select.value)].items.push({name,qty:""});
   persist();render();closeDialog();
  }}
 ]);
 input.focus();
}

function openDelete(){
 const box=document.createElement("div");
 const type=document.createElement("select");
 [
  ["item","Товар"],
  ["section","Категория"]
 ].forEach(([v,t])=>{
  const o=document.createElement("option");
  o.value=v;o.textContent=t;type.appendChild(o);
 });
 const num=makeInput("Номер: например 2 или 2.1");
 const preview=document.createElement("p");
 preview.className="small";
 function update(){
  const value=num.value.trim();
  let found="";
  if(type.value==="section"){
   const i=Number(value)-1;
   if(Number.isInteger(i)&&i>=0&&sections[i]) found=sections[i].name;
  }else{
   const m=value.match(/^(\d+)\.(\d+)$/);
   if(m){
    const s=sections[Number(m[1])-1];
    const item=s?.items[Number(m[2])-1];
    if(item) found=item.name+" ("+s.name+")";
   }else if(/^\d+$/.test(value)){
    const flat=sections.flatMap((s,si)=>s.items.map((it,ii)=>({it,s,si,ii})));
    const row=flat[Number(value)-1];
    if(row) found=row.it.name+" ("+row.s.name+")";
   }
  }
  preview.textContent=found?"Выбран объект: "+found:"Введи существующий номер.";
 }
 type.onchange=update;num.oninput=update;
 box.append("Что удалить:",type,num,preview);
 openDialog("Удалить",box,[
  {label:"Отмена",className:"gray",action:closeDialog},
  {label:"Удалить",className:"red",action:()=>{
   const value=num.value.trim();
   if(type.value==="section"){
    const i=Number(value)-1;
    if(!Number.isInteger(i)||i<0||!sections[i]){update();return;}
    if(!confirm("Удалить категорию и все её товары?"))return;
    sections.splice(i,1);
   }else{
    const m=value.match(/^(\d+)\.(\d+)$/);
    if(m){
     const s=sections[Number(m[1])-1];
     const i=Number(m[2])-1;
     if(!s||!s.items[i]){update();return;}
     s.items.splice(i,1);
    }else if(/^\d+$/.test(value)){
     const flat=sections.flatMap((s,si)=>s.items.map((it,ii)=>({s,ii})));
     const row=flat[Number(value)-1];
     if(!row){update();return;}
     row.s.items.splice(row.ii,1);
    }else{update();return;}
   }
   persist();render();closeDialog();
  }}
 ]);
 num.focus();
}

function openClear(){
 openDialog("Точно очистить?","Все количества будут удалены. Категории и товары останутся.",[
  {label:"Отмена",className:"gray",action:closeDialog},
  {label:"Очистить",className:"red",action:()=>{
   sections.forEach(s=>s.items.forEach(i=>i.qty=""));
   persist();render();closeDialog();
  }}
 ]);
}

function resultText(){
 return sections.map((s,si)=>{
  const rows=[`${si+1} ${s.name}:`];
  s.items.forEach((item,ii)=>{
   const qty=item.qty===""?"0":item.qty;
   rows.push(`${si+1}.${ii+1} ${item.name} - ${qty}`);
  });
  return rows.join("\n");
 }).join("\n\n");
}

async function copyAll(){
 const text=resultText();
 try{
  await navigator.clipboard.writeText(text);
  setStatus("Весь список скопирован.");
 }catch(e){
  const area=document.createElement("textarea");
  area.value=text;
  document.body.appendChild(area);
  area.select();
  const ok=document.execCommand("copy");
  area.remove();
  setStatus(ok?"Весь список скопирован.":"Копирование не удалось. Попробуй другой браузер.");
 }
}

// Скачивание резервного файла
function downloadData(){
 const blob=new Blob([JSON.stringify(sections,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="tovary-backup.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportFile(){
 downloadData();
 setStatus("Файл для сохранения подготовлен.");
}

// Выбрать файл и записывать изменения в него автоматически.
// Работает в браузерах с File System Access API.
async function connectFile(){
 if(!window.showSaveFilePicker){
  alert("Автозапись в выбранный файл не поддерживается этим браузером. Используй Chrome или Edge на компьютере.");
  return;
 }
 try{
  fileHandle=await window.showSaveFilePicker({
   suggestedName:"tovary.json",
   types:[{description:"Файл данных JSON",accept:{"application/json":[".json"]}}]
  });
  await saveFile();
  clearInterval(saveTimer);
  saveTimer=setInterval(()=>saveFile(),60000);
  setStatus("Файл подключён. Автосохранение каждые 60 секунд.");
 }catch(e){
  if(e.name!=="AbortError")setStatus("Не удалось подключить файл.");
 }
}

function saveFile(){
 if(!fileHandle)return Promise.resolve();
 const snapshot=JSON.stringify(sections,null,2);
 saveChain=saveChain.then(async()=>{
  const writable=await fileHandle.createWritable();
  await writable.write(snapshot);
  await writable.close();
  setStatus("Файл автоматически сохранён: "+new Date().toLocaleTimeString());
 }).catch(()=>{
  setStatus("Не удалось записать файл. Проверь разрешение на доступ.");
 });
 return saveChain;
}

// Загрузить ранее сохранённый JSON-файл
async function openFile(){
 if(!window.showOpenFilePicker){
  alert("Открытие файла через окно выбора поддерживается в Chrome и Edge. Можно также импортировать JSON через стандартные средства браузера.");
  return;
 }
 try{
  const [handle]=await window.showOpenFilePicker({
   multiple:false,
   types:[{description:"Файл данных JSON",accept:{"application/json":[".json"]}}]
  });
  const file=await handle.getFile();
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data)||!data.every(s=>
   typeof s.name==="string"&&Array.isArray(s.items)&&
   s.items.every(i=>typeof i.name==="string")
  ))throw new Error("Неверный формат");
  sections=data.map(s=>({
   name:s.name,
   items:s.items.map(i=>({name:i.name,qty:String(i.qty??"")}))
  }));
  persist();render();
  setStatus("Файл загружен. Чтобы автосохранять в него, снова выбери «Автосохранение в файл».");
 }catch(e){
  if(e.name!=="AbortError")alert("Не удалось открыть файл. Проверь, что это файл JSON, созданный этим сайтом.");
 }
}

// Перед закрытием браузера данные уже сохранены в localStorage.
// Браузер не гарантирует завершение асинхронной записи файла
// непосредственно во время закрытия страницы.
window.addEventListener("pagehide",()=>{
 try{localStorage.setItem(KEY,JSON.stringify(sections));}catch(e){}
});

render();
</script>
</body>
</html>
